<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f3eb" />
      <stop offset="60%" stop-color="#ebdcd0" />
      <stop offset="100%" stop-color="#c9bcad" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa907d" />
      <stop offset="100%" stop-color="#967e6c" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bg)" />

  <!-- Geometric Subtle Elements -->
  <circle cx="400" cy="380" r="260" fill="#f4f3eb" opacity="0.6" />
  <circle cx="400" cy="380" r="230" fill="#aa907d" opacity="0.12" />

  <!-- Stylized Figure Representation of Dra. Kaline in White Blazer -->
  <g transform="translate(400, 380)">
    <!-- Hair Waves -->
    <path d="M-110,-120 C-150,-40 -160,80 -130,190 C-100,230 -60,240 -40,200 C-60,140 -80,40 -60,-80 Z" fill="#4a3728" opacity="0.9" />
    <path d="M110,-120 C150,-40 160,80 130,190 C100,230 60,240 40,200 C60,140 80,40 60,-80 Z" fill="#4a3728" opacity="0.9" />
    
    <!-- Head/Face -->
    <ellipse cx="0" cy="-60" rx="65" ry="80" fill="#f1d6c4" />
    <!-- Hair Top -->
    <path d="M-85,-90 C-75,-160 75,-160 85,-90 C60,-130 -60,-130 -85,-90 Z" fill="#3b2b1f" />
    
    <!-- Pearl Necklace -->
    <circle cx="-30" cy="15" r="4" fill="#ffffff" stroke="#c9bcad" stroke-width="1" />
    <circle cx="-20" cy="22" r="4" fill="#ffffff" stroke="#c9bcad" stroke-width="1" />
    <circle cx="-10" cy="26" r="4.5" fill="#ffffff" stroke="#c9bcad" stroke-width="1" />
    <circle cx="0" cy="28" r="5" fill="#ffffff" stroke="#c9bcad" stroke-width="1" />
    <circle cx="10" cy="26" r="4.5" fill="#ffffff" stroke="#c9bcad" stroke-width="1" />
    <circle cx="20" cy="22" r="4" fill="#ffffff" stroke="#c9bcad" stroke-width="1" />
    <circle cx="30" cy="15" r="4" fill="#ffffff" stroke="#c9bcad" stroke-width="1" />

    <!-- White Blazer Suit -->
    <path d="M-75,35 L-140,240 L140,240 L75,35 L40,65 L0,140 L-40,65 Z" fill="#ffffff" stroke="#c9bcad" stroke-width="2" />
    <path d="M-40,65 L0,140 L-70,240" stroke="#c9bcad" stroke-width="1.5" fill="none" />
    <path d="M40,65 L0,140 L70,240" stroke="#c9bcad" stroke-width="1.5" fill="none" />
    
    <!-- Lapel Buttons -->
    <circle cx="-65" cy="150" r="4" fill="#2c2724" />
    <circle cx="-70" cy="165" r="4" fill="#2c2724" />
    <circle cx="-75" cy="180" r="4" fill="#2c2724" />
    <circle cx="-80" cy="195" r="4" fill="#2c2724" />
  </g>

  <!-- Elegant Overlay Frame -->
  <rect x="40" y="40" width="720" height="920" rx="28" fill="none" stroke="#aa907d" stroke-width="1.5" opacity="0.4" />

  <!-- Upper Badge -->
  <rect x="260" y="70" width="280" height="38" rx="19" fill="#aa907d" />
  <text x="400" y="94" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f3eb" text-anchor="middle" letter-spacing="3">
    FOTO DE DESTAQUE
  </text>

  <!-- Bottom Plate -->
  <rect x="70" y="730" width="660" height="200" rx="20" fill="#f4f3eb" fill-opacity="0.94" stroke="#c9bcad" stroke-width="1.5" />
  
  <text x="400" y="785" font-family="serif" font-size="34" font-weight="700" fill="#2c2724" text-anchor="middle">
    Dra. Kaline
  </text>
  
  <text x="400" y="820" font-family="sans-serif" font-size="15" font-weight="600" fill="#aa907d" text-anchor="middle" letter-spacing="1">
    Especialista em Saúde e Restauração Capilar
  </text>

  <line x1="250" y1="845" x2="550" y2="845" stroke="#c9bcad" stroke-width="1" />

  <text x="400" y="880" font-family="sans-serif" font-size="15" font-style="italic" fill="#655d56" text-anchor="middle">
    “Para um diagnóstico preciso”
  </text>
  <text x="400" y="905" font-family="sans-serif" font-size="12" fill="#ada49c" text-anchor="middle">
    Tricoscopia Digital de Alta Resolução • Cirurgia Capilar FUE
  </text>
</svg>
