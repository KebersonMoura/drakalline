<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2724" />
      <stop offset="100%" stop-color="#3d3632" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg2)" />
  <rect x="40" y="40" width="720" height="920" rx="24" fill="none" stroke="#aa907d" stroke-width="1.5" opacity="0.5" />

  <!-- Badge -->
  <rect x="250" y="80" width="300" height="38" rx="19" fill="#aa907d" fill-opacity="0.25" stroke="#aa907d" stroke-width="1.5" />
  <text x="400" y="104" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f3eb" text-anchor="middle" letter-spacing="2">
    TRAJETÓRIA MÉDICA • UTI
  </text>

  <!-- Hospital / Medical Cross Symbol -->
  <g transform="translate(400, 260)" opacity="0.3">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#c9bcad" stroke-width="2" />
    <rect x="-16" y="-55" width="32" height="110" rx="6" fill="#c9bcad" />
    <rect x="-55" y="-16" width="110" height="32" rx="6" fill="#c9bcad" />
  </g>

  <!-- Quote Container -->
  <rect x="80" y="420" width="640" height="420" rx="20" fill="#f4f3eb" stroke="#c9bcad" stroke-width="1" />

  <!-- Quote mark -->
  <text x="120" y="490" font-family="serif" font-size="70" font-weight="700" fill="#aa907d" opacity="0.4">“</text>

  <!-- Real Post Text -->
  <text x="400" y="525" font-family="serif" font-size="28" font-weight="700" fill="#2c2724" text-anchor="middle">
    Essa foto foi tirada
  </text>
  <text x="400" y="565" font-family="serif" font-size="28" font-weight="700" fill="#2c2724" text-anchor="middle">
    durante um plantão na UTI.
  </text>
  
  <text x="400" y="625" font-family="serif" font-size="22" font-style="italic" fill="#aa907d" text-anchor="middle">
    Ela me faz lembrar de algo importante.
  </text>

  <line x1="260" y1="675" x2="540" y2="675" stroke="#c9bcad" stroke-width="1.5" />

  <text x="400" y="725" font-family="sans-serif" font-size="16" fill="#655d56" text-anchor="middle">
    A medicina começa no cuidado com a vida
  </text>
  <text x="400" y="755" font-family="sans-serif" font-size="16" fill="#655d56" text-anchor="middle">
    e se estende à saúde e dignidade do paciente.
  </text>

  <!-- Doctor Footer -->
  <text x="400" y="900" font-family="sans-serif" font-size="14" font-weight="600" fill="#c9bcad" text-anchor="middle">
    DRA. KALINE • @dra_kaline
  </text>
</svg>
