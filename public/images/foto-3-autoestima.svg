<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f3eb" />
      <stop offset="100%" stop-color="#ebdcd0" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg3)" />
  <rect x="40" y="40" width="720" height="920" rx="24" fill="none" stroke="#c9bcad" stroke-width="1.5" />

  <!-- Badge -->
  <rect x="230" y="80" width="340" height="38" rx="19" fill="#aa907d" />
  <text x="400" y="104" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f3eb" text-anchor="middle" letter-spacing="2">
    AUTOESTIMA &amp; SAÚDE CAPILAR
  </text>

  <!-- Hair Silhouette / Organic Waves -->
  <g transform="translate(400, 290)" opacity="0.15">
    <path d="M-150,-100 C-50,-150 120,-80 180,20 C220,90 190,180 120,240 C50,300 -60,260 -120,180 C-180,100 -200,-50 -150,-100 Z" fill="#aa907d" />
  </g>

  <!-- Central Card with Real Text -->
  <rect x="70" y="380" width="660" height="460" rx="24" fill="#ffffff" stroke="#c9bcad" stroke-width="1.5" />

  <text x="400" y="460" font-family="serif" font-size="32" font-weight="700" fill="#2c2724" text-anchor="middle">
    Porque autoestima
  </text>
  <text x="400" y="505" font-family="serif" font-size="32" font-weight="700" fill="#aa907d" text-anchor="middle">
    também é saúde.
  </text>

  <line x1="280" y1="540" x2="520" y2="540" stroke="#c9bcad" stroke-width="1.5" />

  <text x="400" y="605" font-family="sans-serif" font-size="21" font-weight="500" fill="#3b3530" text-anchor="middle">
    E toda mulher merece
  </text>
  <text x="400" y="640" font-family="sans-serif" font-size="21" font-weight="700" fill="#2c2724" text-anchor="middle">
    informação médica de verdade.
  </text>

  <rect x="150" y="700" width="500" height="70" rx="12" fill="#f4f3eb" />
  <text x="400" y="742" font-family="sans-serif" font-size="14" fill="#655d56" text-anchor="middle">
    Tricologia Clínica • Tratamento de Eflúvios e Alopécias
  </text>

  <!-- Doctor Footer -->
  <text x="400" y="900" font-family="sans-serif" font-size="14" font-weight="600" fill="#aa907d" text-anchor="middle">
    DRA. KALINE • @dra_kaline
  </text>
</svg>
