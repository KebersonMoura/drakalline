<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1b18" />
      <stop offset="100%" stop-color="#2c2724" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg4)" />
  <rect x="40" y="40" width="720" height="920" rx="24" fill="none" stroke="#aa907d" stroke-width="1.5" opacity="0.4" />

  <!-- Badge -->
  <rect x="230" y="80" width="340" height="38" rx="19" fill="#aa907d" />
  <text x="400" y="104" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f3eb" text-anchor="middle" letter-spacing="2">
    CONDUTA &amp; ÉTICA MÉDICA
  </text>

  <!-- Quote Card in Charcoal/Cream -->
  <rect x="70" y="240" width="660" height="600" rx="24" fill="#f4f3eb" stroke="#c9bcad" stroke-width="1.5" />

  <text x="400" y="320" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa907d" text-anchor="middle" letter-spacing="3">
    PROPÓSITO CLÍNICO
  </text>

  <!-- Real Main Quote -->
  <text x="400" y="385" font-family="serif" font-size="30" font-weight="800" fill="#2c2724" text-anchor="middle">
    MEU TRABALHO
  </text>
  <text x="400" y="425" font-family="serif" font-size="30" font-weight="800" fill="#aa907d" text-anchor="middle">
    NÃO É INDICAR UM PROCEDIMENTO.
  </text>

  <line x1="240" y1="465" x2="560" y2="465" stroke="#c9bcad" stroke-width="1.5" />

  <text x="400" y="530" font-family="sans-serif" font-size="24" font-weight="600" fill="#2c2724" text-anchor="middle">
    É entender o seu caso
  </text>
  <text x="400" y="570" font-family="sans-serif" font-size="24" font-weight="600" fill="#2c2724" text-anchor="middle">
    e definir qual caminho
  </text>
  <text x="400" y="610" font-family="serif" font-size="26" font-style="italic" font-weight="700" fill="#aa907d" text-anchor="middle">
    faz sentido para você.
  </text>

  <rect x="120" y="670" width="560" height="110" rx="14" fill="#ebdcd0" fill-opacity="0.6" stroke="#c9bcad" stroke-width="1" />
  
  <text x="400" y="715" font-family="sans-serif" font-size="14" font-weight="600" fill="#3b3530" text-anchor="middle">
    Consulta médica detalhada e individualizada
  </text>
  <text x="400" y="745" font-family="sans-serif" font-size="13" fill="#655d56" text-anchor="middle">
    Sem protocolos prontos. Diagnóstico com precisão e verdade.
  </text>

  <text x="400" y="900" font-family="sans-serif" font-size="14" font-weight="600" fill="#c9bcad" text-anchor="middle">
    DRA. KALINE • @dra_kaline
  </text>
</svg>
