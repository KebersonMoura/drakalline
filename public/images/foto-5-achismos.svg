<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f3eb" />
      <stop offset="100%" stop-color="#e2d6c9" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg5)" />
  <rect x="40" y="40" width="720" height="920" rx="24" fill="none" stroke="#c9bcad" stroke-width="1.5" />

  <!-- Badge -->
  <rect x="230" y="80" width="340" height="38" rx="19" fill="#aa907d" />
  <text x="400" y="104" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f3eb" text-anchor="middle" letter-spacing="2">
    INVESTIGAÇÃO MÉDICA
  </text>

  <!-- Central Card -->
  <rect x="70" y="240" width="660" height="600" rx="24" fill="#ffffff" stroke="#c9bcad" stroke-width="1.5" />

  <text x="400" y="325" font-family="serif" font-size="34" font-weight="800" fill="#2c2724" text-anchor="middle">
    Seu cabelo não precisa
  </text>
  <text x="400" y="370" font-family="serif" font-size="34" font-weight="800" fill="#aa907d" text-anchor="middle">
    de achismos.
  </text>

  <text x="400" y="440" font-family="sans-serif" font-size="22" font-weight="600" fill="#3b3530" text-anchor="middle">
    Precisa entender por que está caindo.
  </text>

  <line x1="240" y1="485" x2="560" y2="485" stroke="#c9bcad" stroke-width="1.5" />

  <text x="400" y="555" font-family="serif" font-size="28" font-style="italic" font-weight="700" fill="#2c2724" text-anchor="middle">
    Queda de cabelo é um sinal.
  </text>
  <text x="400" y="605" font-family="sans-serif" font-size="22" font-weight="700" fill="#aa907d" text-anchor="middle">
    E sinais precisam ser investigados.
  </text>

  <rect x="120" y="670" width="560" height="110" rx="14" fill="#f4f3eb" stroke="#c9bcad" stroke-width="1" />
  
  <text x="400" y="715" font-family="sans-serif" font-size="14" font-weight="600" fill="#3b3530" text-anchor="middle">
    Tricoscopia Digital de Alta Resolução + Exames
  </text>
  <text x="400" y="745" font-family="sans-serif" font-size="13" fill="#655d56" text-anchor="middle">
