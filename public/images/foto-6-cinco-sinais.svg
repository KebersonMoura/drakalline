<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2724" />
      <stop offset="100%" stop-color="#1f1b18" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg6)" />
  <rect x="40" y="40" width="720" height="920" rx="24" fill="none" stroke="#aa907d" stroke-width="1.5" opacity="0.5" />

  <!-- Big 5 graphic -->
  <text x="400" y="240" font-family="serif" font-size="160" font-weight="900" fill="#aa907d" opacity="0.3" text-anchor="middle">
    5
  </text>

  <!-- Badge -->
  <rect x="210" y="80" width="380" height="38" rx="19" fill="#aa907d" />
  <text x="400" y="104" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f3eb" text-anchor="middle" letter-spacing="2">
    ALERTA DE SAÚDE CAPILAR
  </text>

  <!-- Content Card -->
  <rect x="70" y="260" width="660" height="580" rx="24" fill="#f4f3eb" stroke="#c9bcad" stroke-width="1.5" />

  <text x="400" y="330" font-family="serif" font-size="30" font-weight="800" fill="#2c2724" text-anchor="middle">
    5 SINAIS DE QUE SEU
  </text>
  <text x="400" y="375" font-family="serif" font-size="28" font-weight="800" fill="#aa907d" text-anchor="middle">
    COURO CABELUDO PODE
  </text>
  <text x="400" y="420" font-family="serif" font-size="28" font-weight="800" fill="#2c2724" text-anchor="middle">
    ESTAR INFLAMADO
  </text>

  <line x1="240" y1="455" x2="560" y2="455" stroke="#c9bcad" stroke-width="1.5" />

  <text x="400" y="515" font-family="sans-serif" font-size="19" font-style="italic" fill="#655d56" text-anchor="middle">
    Alguns sinais parecem comuns,
  </text>
  <text x="400" y="550" font-family="sans-serif" font-size="20" font-weight="700" fill="#2c2724" text-anchor="middle">
    mas não deveriam ser ignorados:
  </text>

  <!-- 5 items grid / list -->
  <g transform="translate(140, 590)">
    <circle cx="20" cy="18" r="14" fill="#aa907d" />
    <text x="20" y="23" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="45" y="23" font-family="sans-serif" font-size="15" font-weight="600" fill="#2c2724">Coceira ou ardência frequente</text>

    <circle cx="20" cy="54" r="14" fill="#aa907d" />
    <text x="20" y="59" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="45" y="59" font-family="sans-serif" font-size="15" font-weight="600" fill="#2c2724">Sensibilidade e dor ao toque (tricodinia)</text>

    <circle cx="20" cy="90" r="14" fill="#aa907d" />
    <text x="20" y="95" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="45" y="95" font-family="sans-serif" font-size="15" font-weight="600" fill="#2c2724">Descamação constante (caspa/seborreia)</text>

    <circle cx="20" cy="126" r="14" fill="#aa907d" />
    <text x="20" y="131" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="45" y="131" font-family="sans-serif" font-size="15" font-weight="600" fill="#2c2724">Vermelhidão ao redor dos folículos</text>

    <circle cx="20" cy="162" r="14" fill="#aa907d" />
    <text x="20" y="167" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="45" y="167" font-family="sans-serif" font-size="15" font-weight="600" fill="#2c2724">Aumento abrupto de queda capilar</text>
  </g>

  <text x="400" y="900" font-family="sans-serif" font-size="14" font-weight="600" fill="#c9bcad" text-anchor="middle">
    DRA. KALINE • @dra_kaline
  </text>
</svg>
